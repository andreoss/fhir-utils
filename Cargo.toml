[package]
name = "fhir-utils"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
once_cell = "1.19"
uuid = { version = "1.26.0", features = ["v4"] }
base64 = "0.23.1"

[dev-dependencies]
tempfile = "3.10"
serial_test = "3.0"

[features]
optimized-streaming = []
